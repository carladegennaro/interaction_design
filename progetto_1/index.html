<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eyes on Earth - The Scale of Change</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
<style>
    body { margin: 0; padding: 0; background-color: #000; color: white; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; overflow: hidden; }
    canvas { position: fixed; top: 0; left: 0; z-index: -1; }

    /* --- UI GENERALE --- */
    #page-0 { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
        background: #000; z-index: 200; display: flex; justify-content: center; align-items: center; 
        padding: 0 80px; box-sizing: border-box; transition: opacity 0.8s ease;
    }
    #page-0.hidden { opacity: 0; pointer-events: none; }
    .p0-container { display: flex; width: 100%; max-width: 1200px; align-items: flex-start; gap: 100px; }
    .p0-title { font-weight: 900; font-size: 84px; margin: 0; letter-spacing: -2px; line-height: 0.9; text-transform: uppercase; }
    .p0-credits { font-size: 14px; margin-top: 25px; opacity: 0.6; line-height: 1.5; text-transform: uppercase; letter-spacing: 1px; }
    .p0-desc { font-size: 18px; line-height: 1.6; opacity: 0.9; margin: 0; }
    .explore-btn { margin-top: 40px; padding: 15px 30px; font-size: 14px; border: 1px solid white; color: white; background: transparent; text-transform: uppercase; cursor: pointer; transition: 0.3s; }
    .explore-btn:hover { background: white; color: black; }

    .nav-btn, .chapter-btn { 
        padding: 15px; border: 1px solid rgba(255,255,255,0.3); color: white; background: rgba(0,0,0,0.5); 
        cursor: pointer; transition: 0.3s; font-size: 12px; letter-spacing: 1px; text-align: left; 
        min-width: 150px; text-transform: uppercase; pointer-events: auto;
    }
    .nav-btn:hover, .nav-btn.active, .chapter-btn:hover, .chapter-btn.active { 
        background: white; color: black; font-weight: bold; border-color: white; 
    }

    #ui-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; pointer-events: none; z-index: 10; display: none; }
    #ui-layer.active { display: block; }
    .side-nav { position: absolute; left: 40px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 20px; }
    
    .info-panel { position: absolute; right: 60px; top: 50%; transform: translateY(-50%); width: 320px; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(15px); padding: 30px; border-left: 3px solid #fff; opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
    .info-panel.visible { opacity: 1; pointer-events: auto; }
    .info-panel h2 { font-size: 32px; margin: 0 0 15px 0; }
    .info-panel p { font-size: 16px; opacity: 0.9; line-height: 1.6; margin-bottom: 25px; }
    .read-more-btn { padding: 10px 20px; border: 1px solid white; color: white; background: transparent; cursor: pointer; text-transform: uppercase; font-size: 11px; transition: 0.3s; }
    .read-more-btn:hover { background: white; color: black; }

    /* --- PAGINA 2: DETTAGLIO --- */
    #detail-page { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
        background: #000; z-index: 300; display: none; 
        box-sizing: border-box; padding: 0 60px 0 40px; 
        align-items: center; justify-content: flex-start;
    }
    #detail-page.active { display: flex; }
    .detail-grid { display: flex; width: 100%; height: 80vh; gap: 60px; align-items: center; }
    .detail-chapters { flex: 0 0 150px; display: flex; flex-direction: column; gap: 20px; }
    .detail-text { flex: 0 0 400px; max-height: 80vh; overflow-y: auto; font-size: 14px; line-height: 1.8; opacity: 0.8; text-align: justify; padding-right: 15px; order: 2; scroll-behavior: smooth; }
    .detail-text h1 { font-size: 48px; margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: -1px; }
    .detail-text h3 { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.5); margin-bottom: 30px; }
    
    /* BORDO BIANCO AGGIUNTO AL CONTENITORE 3D */
    #detail-3d-container { 
        flex: 1; height: 100%; display: flex; align-items: center; justify-content: center; 
        order: 3; position: relative; overflow: hidden; 
        border: 1px solid white; /* Bordo bianco */
    }
    #detail-3d-container canvas { position: relative !important; z-index: 1; }
    
    .back-btn { position: absolute; top: 40px; left: 40px; background: transparent; border: 1px solid white; color: white; padding: 12px 20px; cursor: pointer; text-transform: uppercase; font-size: 11px; z-index: 310; transition: 0.3s; }
    .back-btn:hover { background: white; color: black; }
</style>
</head>
<body>

<div id="page-0">
    <div class="p0-container">
        <div style="flex:1"><h1 class="p0-title">Eyes on<br>Earth</h1><div class="p0-credits">Carla De Gennaro<br>CV429.02 Interaction Design<br>SUPSI SP25/26</div></div>
        <div style="flex:1"><p class="p0-desc">In onore dei 70 anni della NASA, questo progetto mira a mostrare come siano stati utili i satelliti per monitorare il cambiamento climatico.</p><button class="explore-btn" onclick="startExperience()">Esplora</button></div>
    </div>
</div>

<div id="ui-layer">
    <div class="side-nav">
        <button class="nav-btn" onclick="selectSatellite(0)" id="btn-0">OCO-2</button>
        <button class="nav-btn" onclick="selectSatellite(1)" id="btn-1">SENTINEL-6</button>
        <button class="nav-btn" onclick="selectSatellite(2)" id="btn-2">ICESAT-2</button>
    </div>
    <div id="info-panel" class="info-panel">
        <h2 id="sat-name"></h2><p id="sat-desc"></p><button class="read-more-btn" onclick="openDetails()">Leggi di più</button>
    </div>
</div>

<div id="detail-page">
    <button class="back-btn" onclick="closeDetails()">← Indietro</button>
    <div class="detail-grid">
        <div class="detail-chapters">
            <button class="chapter-btn active" onclick="changeChapter('storia', this)">Storia</button>
            <button class="chapter-btn" onclick="changeChapter('come', this)">Come funziona</button>
            <button class="chapter-btn" onclick="changeChapter('perche', this)">Perché viene usato</button>
        </div>
        <div class="detail-text">
            <h1 id="detail-title">NOME</h1>
            <h3 id="detail-chapter-name">STORIA</h3>
            <div id="detail-content">
                <!-- Testo dinamico inserito qui -->
            </div>
        </div>
        <div id="detail-3d-container"></div>
    </div>
</div>

<script>
let earthImg, models = [];
let stars = [], satellites = [];
let isInteracting = false, isDetailPage = false;
let rotX = 0, rotY = 0, camZ = 1000, targetCamZ = 1000;
let lookAt, targetLookAt, selectedSatIndex = -1, detailP5;

// DATI TESTUALI AGGIORNATI
const chapterData = {
    0: { // OCO-2
        storia: "L'Orbiting Carbon Observatory-2 (OCO-2) è una missione della NASA posizionata in un'orbita polare eliosincrona, con un ciclo di ripetizione di 16 giorni. Il satellite attraversa l'equatore terrestre sempre alla stessa ora locale (circa le 13:35), per massimizzare il rapporto segnale-rumore sfruttando l'alta illuminazione solare. L'orbita di OCO-2 è coordinata con il cosiddetto 'A-train', una costellazione di satelliti scientifici (come Aqua e Aura) per integrare i propri dati con altre misurazioni atmosferiche.",
        come: "OCO-2 non misura direttamente l'anidride carbonica, ma rileva l'intensità della luce solare riflessa dalla superficie terrestre a lunghezze d'onda specifiche. I gas atmosferici assorbono la luce, lasciando 'un'impronta digitale' inconfondibile che gli spettrometri del satellite catturano. Il sistema osserva tre specifiche bande di lunghezza d'onda del vicino infrarosso in simultanea: Banda A dell'ossigeno (O2 a 0,76 µm), Banda debole della CO2 (1,61 µm) essenziale per rilevare la concentrazione in prossimità della superficie, e Banda forte della CO2 (2,06 µm) sensibile ad aerosol e umidità. Il satellite effettua fino a 72.000 campionamenti per orbita.",
        perche: "L'obiettivo principale di OCO-2 è ottenere una distribuzione geografica globale delle fonti e dei serbatoi ('sinks') di anidride carbonica. Elaborando le frazioni molari dell'anidride carbonica atmosferica (chiamate XCO2), OCO-2 fornisce ai climatologi dati cruciali per comprendere i cicli del carbonio a livello mondiale. L'alta densità di campionamento permette agli scienziati di mappare con un dettaglio senza precedenti l'accumulo di gas serra, monitorando le dinamiche che guidano il surriscaldamento globale."
    },
    1: { // SENTINEL-6
        storia: "La missione Sentinel-6 è il frutto di una profonda collaborazione storica tra Stati Uniti ed Europa (NASA, ESA, EUMETSAT, NOAA e CNES). I satelliti Sentinel-6 ereditano il lavoro di tre decenni di misurazioni iniziate nel 1992 con la missione TOPEX/Poseidon. La missione si articola in due satelliti gemelli: Sentinel-6 Michael Freilich, lanciato a novembre 2020, e Sentinel-6B, lanciato il 16 novembre 2025.",
        come: "La serie Sentinel-6 sfrutta strumenti all'avanguardia per l'altimetria. A bordo si trova un altimetro radar (Poseidon-4) combinato con un radiometro a microonde avanzato (AMR-C), che permette di rilevare variazioni minime della superficie oceanica ad altissima risoluzione. Inoltre, incorpora lo strumento GNSS-RO che traccia i segnali radio dei satelliti di navigazione; misurando come questi si piegano attraversando l'atmosfera, gli scienziati calcolano densità, temperatura e umidità atmosferica.",
        perche: "I dati forniti rappresentano il 'gold standard' per lo studio dell'innalzamento del livello del mare indotto dal cambiamento climatico. Poiché l'oceano assorbe più del 90% del calore causato dai gas serra, il satellite monitora le variazioni su scala millimetrica. Questi dati servono per alimentare i modelli climatici a lungo termine, migliorare le previsioni meteorologiche e prevedere lo sviluppo di uragani."
    },
    2: { // ICESAT-2
        storia: "La serie ICESat fa parte dei programmi di osservazione della Terra della NASA dedicati alla criosfera. Il primo satellite ha raccolto dati dal 2003 al 2010. Per colmare il vuoto tecnologico in vista del successore, la NASA ha lanciato Operation IceBridge tramite rilevamenti aerei. Alla fine del 2018 è stato lanciato ICESat-2, che continua attivamente le misurazioni.",
        come: "ICESat-2 porta a bordo l'ATLAS (Advanced Topographic Laser Altimeter System), un altimetro laser che spara 10.000 impulsi al secondo. Il raggio viene diviso in sei fasci per misurare anche l'inclinazione della superficie. Registrando esattamente quanto tempo impiega l'impulso laser per rimbalzare sulla superficie e tornare nello spazio, il satellite calcola l'altezza del suolo con letture distanti appena 71 centimetri lungo il proprio avanzamento.",
        perche: "Lo scopo essenziale è rispondere al destino delle calotte polari in un clima che si surriscalda. Viene usato per stimare la perdita o il guadagno annuale di altezza delle calotte glaciali di Groenlandia e Antartide con una precisione di 4 millimetri. Oltre al ghiaccio, le misurazioni sono sfruttate per quantificare il carbonio nelle foreste, monitorare lo stato di fiumi e laghi per la gestione della siccità e analizzare l'effetto delle nuvole alte."
    }
};

function preload() {
    earthImg = loadImage('earth albedo.jpg');
    models[0] = loadModel('Orbiting Carbon Observatory (OCO) 2.obj', true);
    models[1] = loadModel('Jason Continuity of Service (Sentinel-6).obj', true);
    models[2] = loadModel('Ice, Clouds, and Land Elevation Satellite-2 (ICESat-2) (A).obj', true);
}

function setup() {
    let mainCanvas = createCanvas(windowWidth, windowHeight, WEBGL);
    mainCanvas.style('display', 'block');
    lookAt = createVector(0, 0, 0);
    targetLookAt = createVector(0, 0, 0);
    for (let i = 0; i < 900; i++) stars.push(createVector(random(-2000, 2000), random(-2000, 2000), random(-2000, 2000)));
    
    satellites = [
        { name: "OCO-2", pos: createVector(260, -70, 120), color: [255, 120, 50], desc: "Analisi della CO2 atmosferica." },
        { name: "SENTINEL-6", pos: createVector(-290, 60, -140), color: [100, 255, 200], desc: "Monitoraggio del livello degli oceani." },
        { name: "ICESAT-2", pos: createVector(120, -300, 80), color: [100, 200, 255], desc: "Misurazione laser dei ghiacci." }
    ];
}

function draw() {
    if (!isInteracting || isDetailPage) return;
    background(0);
    if (mouseIsPressed && mouseX > 250) {
        rotY += (mouseX - pmouseX) * 0.005;
        rotX -= (mouseY - pmouseY) * 0.005;
    }
    camZ = lerp(camZ, targetCamZ, 0.08);
    lookAt.x = lerp(lookAt.x, targetLookAt.x, 0.08);
    lookAt.y = lerp(lookAt.y, targetLookAt.y, 0.08);
    lookAt.z = lerp(lookAt.z, targetLookAt.z, 0.08);
    camera(0, 0, camZ, lookAt.x, lookAt.y, lookAt.z, 0, 1, 0);
    ambientLight(50); pointLight(255, 255, 255, 0, 0, camZ); 
    push(); stroke(255); strokeWeight(1.5); for (let s of stars) point(s.x, s.y, s.z); pop();
    push(); rotateX(rotX); rotateY(rotY);
    push(); noStroke(); texture(earthImg); sphere(200); pop();
    let hoveredIndex = -1;
    for (let i = 0; i < satellites.length; i++) {
        let s = satellites[i];
        if (selectedSatIndex === i) {
            let v = getRotatedPos(s.pos);
            targetLookAt.set(v.x, v.y, v.z);
        }
        push(); translate(s.pos.x, s.pos.y, s.pos.z);
        let sc = getScreenCoords(s.pos);
        if (dist(mouseX, mouseY, sc.x, sc.y) < 50) hoveredIndex = i;
        rotateX(PI); scale(0.22);
        if (selectedSatIndex === i || hoveredIndex === i) { emissiveMaterial(s.color); specularMaterial(255); }
        else { emissiveMaterial(s.color[0] * 0.6, s.color[1] * 0.6, s.color[2] * 0.6); fill(s.color); }
        noStroke(); model(models[i]); pop();
    }
    pop();
    cursor(hoveredIndex !== -1 ? HAND : ARROW);
}

function changeChapter(chapterKey, btnElement) {
    document.querySelectorAll('.chapter-btn').forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');
    
    let chapterTitle = "";
    if(chapterKey === 'storia') chapterTitle = "STORIA";
    else if(chapterKey === 'come') chapterTitle = "COME FUNZIONA";
    else if(chapterKey === 'perche') chapterTitle = "UTILITÀ";

    document.getElementById('detail-chapter-name').innerText = chapterTitle;
    document.getElementById('detail-content').innerText = chapterData[selectedSatIndex][chapterKey];
    document.querySelector('.detail-text').scrollTop = 0;
}

function openDetails() {
    isDetailPage = true;
    document.getElementById('detail-page').classList.add('active');
    document.getElementById('detail-title').innerText = satellites[selectedSatIndex].name;
    const firstBtn = document.querySelector('.chapter-btn');
    changeChapter('storia', firstBtn);
    if (!detailP5) detailP5 = new p5(detailSketch); 
}

function closeDetails() { isDetailPage = false; document.getElementById('detail-page').classList.remove('active'); }

const detailSketch = (p) => {
    p.setup = () => {
        let container = document.getElementById('detail-3d-container');
        let cnv = p.createCanvas(container.offsetWidth, container.offsetHeight, p.WEBGL);
        cnv.parent('detail-3d-container');
    };
    p.draw = () => {
        p.background(0); p.orbitControl(); p.ambientLight(150); p.pointLight(255, 255, 255, 0, 0, 400);
        if (selectedSatIndex !== -1) {
            p.push(); p.rotateX(p.PI); p.rotateY(p.frameCount * 0.005); p.scale(3.2);
            p.fill(satellites[selectedSatIndex].color);
            p.emissiveMaterial(satellites[selectedSatIndex].color[0]*0.5, satellites[selectedSatIndex].color[1]*0.5, satellites[selectedSatIndex].color[2]*0.5);
            p.noStroke(); p.model(models[selectedSatIndex]); p.pop();
        }
    };
    p.windowResized = () => {
        let container = document.getElementById('detail-3d-container');
        p.resizeCanvas(container.offsetWidth, container.offsetHeight);
    };
};

function selectSatellite(index) {
    selectedSatIndex = index;
    let s = satellites[index];
    document.getElementById('info-panel').classList.add('visible');
    document.getElementById('sat-name').innerText = s.name;
    document.getElementById('sat-desc').innerText = s.desc;
    document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', i === index));
    targetCamZ = 450;
}
function deselectAll() {
    selectedSatIndex = -1; targetCamZ = 1000; targetLookAt.set(0, 0, 0);
    document.getElementById('info-panel').classList.remove('visible');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
}
function startExperience() { document.getElementById('page-0').classList.add('hidden'); document.getElementById('ui-layer').classList.add('active'); isInteracting = true; }
function getRotatedPos(pos) {
    let y1 = pos.y * cos(rotX) - pos.z * sin(rotX);
    let z1 = pos.y * sin(rotX) + pos.z * cos(rotX);
    let x2 = pos.x * cos(rotY) + z1 * sin(rotY);
    let z2 = -pos.x * sin(rotY) + z1 * cos(rotY);
    return createVector(x2, y1, z2);
}
function getScreenCoords(pos) {
    let v = getRotatedPos(pos);
    let factor = camZ / (camZ - v.z);
    return { x: v.x * factor + width/2, y: v.y * factor + height/2 };
}
function mousePressed() {
    if (!isInteracting || isDetailPage || mouseX < 250) return;
    let clickedSat = -1;
    satellites.forEach((s, i) => {
        let sc = getScreenCoords(s.pos);
        if (dist(mouseX, mouseY, sc.x, sc.y) < 50) clickedSat = i;
    });
    if (clickedSat !== -1) selectSatellite(clickedSat);
    else if (mouseX < width - 400) deselectAll();
}
function windowResized() { resizeCanvas(windowWidth, windowHeight); }
</script>
</body>
</html>
